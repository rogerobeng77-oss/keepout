[project]
name = "keepout"
version = "1.0.0"
description = "Danger-zone and machine-guard monitoring for a fixed camera, on OpenCV 5"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.3",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    "boto3==1.43.95",
    "visioncore",
    "servicekit",
]

[project.scripts]
keepout = "keepout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepout"]

[tool.uv.sources]
visioncore = { path = "../../packages/visioncore", editable = true }
servicekit = { path = "../../packages/servicekit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs the YOLOX model and real video decoding",
    "aws: touches real AWS",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
